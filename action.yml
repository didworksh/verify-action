name: "DidWork — verify outcomes"
description: "Verify that the outcomes a pull request claims are actually true, and block the merge when they are not."
author: "DidWork"
branding:
  icon: "check-circle"
  color: "blue"

inputs:
  api-key:
    description: >-
      DidWork API key. Without one the gate still runs, but only http.ok claims
      verify and nothing is stored, so there are no receipts. Free at
      https://didwork.sh/console.
    required: false
  config:
    description: "Path to the gate file (default: .didwork.yml)"
    required: false
  contract:
    description: "Evaluate a version 2 outcome contract"
    default: "false"
  trusted-ref:
    description: "Full SHA of the reviewed contract commit, supplied by a protected workflow"
    required: false
  revision:
    description: "Full SHA of the deployment being verified"
    required: false
  comment:
    description: "Post the result as a pull request comment (needs pull-requests: write)"
    required: false
    default: "true"
  version:
    description: "Version of the didwork CLI to run"
    required: false
    default: "0.3.0"
  github-token:
    description: "Token used to write the pull request comment. Defaults to the workflow's own token."
    required: false
    default: ${{ github.token }}

runs:
  using: "composite"
  steps:
    - name: Verify outcomes
      shell: bash
      # Inputs reach the script as environment variables, never as `${{ }}`
      # interpolated into the source: a value containing shell metacharacters
      # would otherwise execute as part of this script.
      env:
        DIDWORK_API_KEY: ${{ inputs.api-key }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        INPUT_CONFIG: ${{ inputs.config }}
        INPUT_COMMENT: ${{ inputs.comment }}
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_CONTRACT: ${{ inputs.contract }}
        INPUT_TRUSTED_REF: ${{ inputs.trusted-ref }}
        INPUT_REVISION: ${{ inputs.revision }}
      run: |
        set -euo pipefail
        args=()
        if [ "${INPUT_CONTRACT}" = "true" ]; then
          if [ -z "${INPUT_TRUSTED_REF}" ] || [ -z "${INPUT_REVISION}" ]; then
            echo "Contract mode requires trusted-ref and revision. Configure these in the protected workflow." >&2
            exit 2
          fi
          args+=(--contract --trusted-ref "${INPUT_TRUSTED_REF}" --revision "${INPUT_REVISION}")
        fi
        if [ -n "${INPUT_CONFIG}" ]; then
          args+=(--config "${INPUT_CONFIG}")
        fi
        if [ "${INPUT_COMMENT}" = "true" ]; then
          args+=(--comment)
        fi
        npx --yes "@didwork/inspect@${INPUT_VERSION}" verify ${args[@]+"${args[@]}"}
